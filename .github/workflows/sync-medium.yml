name: Sync Medium Articles

on:
  schedule:
    - cron: '0 9 * * *'   # Her gün 09:00 UTC (12:00 Türkiye)
  workflow_dispatch:        # GitHub'dan elle de tetiklenebilir

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run sync script
        id: sync
        run: |
          python scripts/sync_medium.py
          if git diff --quiet -- pages/blog.html; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Yeni yazı masaüstüne, Notlar'a, aramaya, Ask'e ve sitemap'e ancak build ile düşer
      - name: Set up Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        if: steps.sync.outputs.changed == 'true'
        working-directory: _build
        run: |
          npm ci
          node build.mjs --base= --out=.. --index=true

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "medium-sync[bot]"
          git config user.email "medium-sync@users.noreply.github.com"
          git add -A
          git commit -m "sync: Medium'dan yeni makale eklendi"
          git push
